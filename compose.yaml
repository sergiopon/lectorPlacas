services:
  lector:
    build: .
    image: lector-placas:local
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./videos:/app/videos:ro
      - ./data:/app/data
      - ./logs:/app/logs
    secrets:
      - lector_key
    restart: "no"
  lector-gpu:
    extends:
      service: lector
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
secrets:
  lector_key:
    file: ./secrets/lector_key
