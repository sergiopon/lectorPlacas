services:
  lector:
    build: .
    image: lector-placas:local
    environment:
      LECTOR_EXECUTION_PROVIDER: cpu
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - "${LECTOR_VIDEOS_DIR:-./videos}:/app/videos:ro"
      - "lector-data:/app/data"
      - "lector-logs:/app/logs"
      - "lector-keys:/app/keys"
    restart: "no"
  lector-gpu:
    extends:
      service: lector
    profiles: ["gpu"]
    environment:
      LECTOR_EXECUTION_PROVIDER: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  lector-data: {}
  lector-logs: {}
  lector-keys: {}
