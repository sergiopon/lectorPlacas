[project]
name = "lector-placas"
version = "0.1.0"
description = "ALPR local para placas colombianas"
requires-python = "==3.13.*"
license = "AGPL-3.0-only"
dependencies = [
    "numpy==2.5.3",
    "opencv-python==4.14.0.94",
    "av==18.1.0",
    "onnxruntime-gpu[cuda,cudnn]==1.30.0",
    "fast-plate-ocr==1.1.0",
    "open-image-models==0.6.0",
    "trackers==2.6.0",
    "supervision==0.30.5",
    "sqlcipher3==0.6.2",
    "cryptography==50.0.1",
    "keyring==25.7.0",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[project.scripts]
lector = "lector_placas.cli.main:main"
lector-web = "lector_placas.web.app:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pip-audit==2.10.1",
    "onnx==1.23.0",
    "types-PyYAML==6.0.12.20260906",
    "httpx2==2.13.1",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["training", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C90", "S", "ANN", "D", "RUF", "SIM", "PTH", "BLE", "PL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 20
max-branches = 8
max-returns = 4

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D", "PLR2004", "PLR0913", "PLC0415", "S311", "N817", "E501", "S603", "S108"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["lector_placas"]

[[tool.mypy.overrides]]
module = [
    "onnxruntime.*", "sqlcipher3.*", "trackers.*", "supervision.*", "open_image_models.*",
    "fast_plate_ocr.*", "keyring.*", "onnx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requiere GPU NVIDIA y drivers",
    "integration: usa librerías nativas reales (PyAV, SQLCipher, ONNX Runtime, keyring)",
]
